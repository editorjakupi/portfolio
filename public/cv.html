<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor Jakupi — CV</title>
    <style>
      :root {
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0d9488;
        --accent-dark: #0f766e;
        --line: #cbd5e1;
        --border: #e5e7eb;
        --aside-w: 136px;
        --rail-w: 20px;
        --main-gap: 1.15rem;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: var(--text);
        line-height: 1.55;
        background: #eef2f6;
        padding: 2rem 1rem 3rem;
      }
      .cv-toolbar {
        max-width: 900px;
        margin: 0 auto 1.25rem;
      }
      .cv-toolbar__inner {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 0.55rem 0.65rem 0.55rem 0.85rem;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
        backdrop-filter: blur(10px);
      }
      .cv-toolbar__back {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        flex-shrink: 0;
        padding: 0.45rem 0.65rem;
        border-radius: 10px;
        font-size: 0.84rem;
        font-weight: 500;
        color: var(--muted);
        text-decoration: none;
        transition: color 0.15s, background 0.15s;
      }
      .cv-toolbar__back:hover {
        color: var(--accent-dark);
        background: #f0fdfa;
      }
      .cv-toolbar__back svg {
        width: 1rem;
        height: 1rem;
        flex-shrink: 0;
      }
      .cv-toolbar__langs {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        flex: 1;
        gap: 0.2rem;
        padding: 0.28rem;
        background: #f1f5f9;
        border-radius: 11px;
        border: 1px solid #e2e8f0;
        min-width: 0;
      }
      .cv-toolbar__langs button {
        padding: 0.35rem 0.45rem;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.76rem;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        text-align: center;
        transition: color 0.15s, background 0.15s, box-shadow 0.15s;
      }
      .cv-toolbar__langs button:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.65);
      }
      .cv-toolbar__langs button.active {
        background: white;
        color: var(--accent-dark);
        font-weight: 600;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      }
      .cv-toolbar__actions {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        flex-shrink: 0;
      }
      .cv-toolbar__print {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        flex-shrink: 0;
        padding: 0.52rem 0.95rem;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
        color: white;
        font: inherit;
        font-size: 0.84rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(13, 148, 136, 0.28);
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .cv-toolbar__print--ghost {
        background: white;
        color: var(--accent-dark);
        border: 1px solid #99f6e4;
        box-shadow: none;
      }
      .cv-toolbar__print--ghost:hover {
        background: #f0fdfa;
        box-shadow: none;
      }
      .cv-toolbar__print:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(13, 148, 136, 0.34);
      }
      .cv-toolbar__print svg {
        width: 1rem;
        height: 1rem;
        flex-shrink: 0;
      }
      .cv-toolbar__print:disabled {
        opacity: 0.75;
        cursor: wait;
        transform: none;
      }
      .page {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2.25rem 2rem 2.5rem 1.75rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      .page.page--export {
        width: 900px;
        max-width: 900px;
        border: none;
        box-shadow: none;
        border-radius: 0;
        margin: 0;
        padding: 2.25rem 2.75rem 2.5rem 1.75rem;
        overflow: visible;
        background: #ffffff;
        box-sizing: border-box;
      }
      .page.page--export .cv-flow,
      .page.page--export .cv-main,
      .page.page--export .cv-row,
      .page.page--export .lang-row {
        overflow: visible;
      }
      .page.page--export .lang-row {
        grid-template-columns: 6rem minmax(0, 1fr) 5.75rem;
        gap: 0.5rem;
      }
      .page.page--export .lang-bars {
        max-width: 170px;
      }
      .page.page--export .lang-level {
        font-size: 0.76rem;
        text-align: right;
      }
      .page.page--export .cv-block { margin-bottom: 0.65rem; }
      .page.page--export .cv-block--section-head { margin-bottom: 0.35rem; }
      .page.page--export .cv-main { padding-bottom: 0.4rem; }
      .page.page--export .cv-top { margin-bottom: 1.1rem; }
      .page.page--export .tl-desc { line-height: 1.48; }
      .page.page--export .link-list li { margin-bottom: 0.2rem; }
      .page.page--export .lang-row { margin-bottom: 0.4rem; }

      /* Header — photo left, name + contact right */
      .cv-top {
        display: grid;
        grid-template-columns: 108px 1fr;
        gap: 1.5rem;
        align-items: start;
        margin-bottom: 2rem;
        padding-bottom: 0.25rem;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .cv-photo {
        width: 108px;
        height: 108px;
        object-fit: cover;
        object-position: center 90%;
        border-radius: 4px;
        background: #f1f5f9;
        display: block;
        image-rendering: -webkit-optimize-contrast;
      }
      .cv-name {
        font-size: 2.15rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--accent);
        line-height: 1.1;
        margin-bottom: 0.85rem;
      }
      .cv-contact-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        font-size: 0.88rem;
        color: var(--muted);
      }
      .cv-contact-list li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .cv-contact-list a {
        color: var(--accent-dark);
        text-decoration: none;
      }
      .cv-contact-list a:hover { text-decoration: underline; }
      .cv-icon {
        width: 1rem;
        text-align: center;
        color: var(--accent);
        flex-shrink: 0;
        font-size: 0.82rem;
      }

      /* Timeline — aside (labels/dates) | rail (line + dot) | main (content) */
      .cv-flow {
        position: relative;
      }
      .cv-flow::before {
        content: '';
        position: absolute;
        left: calc(var(--aside-w) + var(--rail-w) / 2 - 1px);
        top: 0.5rem;
        bottom: 0;
        width: 2px;
        background: var(--line);
        z-index: 0;
      }
      .cv-row {
        display: grid;
        grid-template-columns: var(--aside-w) var(--rail-w) 1fr;
        column-gap: 0;
        align-items: start;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .cv-block {
        margin-bottom: 1.2rem;
      }
      .cv-block:last-child {
        margin-bottom: 0;
      }
      .cv-aside {
        text-align: right;
        padding-right: 0.7rem;
        padding-top: 0.15rem;
      }
      .cv-aside h2 {
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--accent);
        line-height: 1.3;
      }
      .cv-aside.cv-date {
        font-size: 0.76rem;
        color: var(--muted);
        font-weight: 400;
        line-height: 1.35;
        padding-top: 0.2rem;
      }
      .cv-rail {
        position: relative;
        width: var(--rail-w);
        min-height: 1.25rem;
      }
      .cv-dot {
        position: absolute;
        left: 50%;
        top: 0.38rem;
        transform: translateX(-50%);
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px white;
        z-index: 2;
      }
      .cv-main {
        font-size: 0.92rem;
        color: var(--muted);
        padding-left: var(--main-gap);
        padding-top: 0.1rem;
        padding-bottom: 0.75rem;
        min-width: 0;
        overflow-wrap: break-word;
      }
      .cv-row:last-child .cv-main,
      .cv-block .cv-row:last-child .cv-main {
        padding-bottom: 0;
      }
      .cv-main p { margin-bottom: 0.5rem; }
      .cv-main p:last-child { margin-bottom: 0; }
      .cv-main--spacer {
        padding-bottom: 0.35rem;
        min-height: 0;
      }

      /* Languages with C2 bars */
      .lang-row {
        display: grid;
        grid-template-columns: 7rem 1fr auto;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.55rem;
        font-size: 0.88rem;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .lang-row:last-child { margin-bottom: 0; }
      .lang-name { color: var(--text); font-weight: 500; }
      .lang-bars {
        display: flex;
        gap: 2px;
        height: 13px;
        align-items: stretch;
        max-width: 220px;
      }
      .lang-block {
        flex: 1;
        min-width: 0;
        max-width: 22px;
        background: #e5e7eb;
        border-radius: 1px;
      }
      .lang-block.filled { background: var(--accent); }
      .lang-level {
        font-size: 0.78rem;
        color: var(--muted);
        white-space: nowrap;
      }

      /* Links list */
      .link-list { list-style: none; }
      .link-list li { margin-bottom: 0.35rem; }
      .link-list a {
        color: var(--accent-dark);
        text-decoration: none;
        word-break: break-all;
      }
      .link-list a:hover { text-decoration: underline; }

      /* Skills — two columns like PDF */
      .skills-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.35rem 2rem;
        font-size: 0.86rem;
        color: var(--text);
      }
      .skills-cols ul {
        list-style: disc;
        padding-left: 1.15rem;
      }
      .skills-cols li {
        margin-bottom: 0.22rem;
        padding-left: 0.1rem;
      }

      /* Experience / education — dates in aside column (left of line) */
      .tl-role {
        font-weight: 600;
        color: var(--text);
        font-size: 0.92rem;
        margin-bottom: 0.15rem;
      }
      .tl-org {
        font-size: 0.86rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      .tl-desc {
        font-size: 0.88rem;
        line-height: 1.55;
      }

      @page {
        size: A4 portrait;
        margin: 14mm;
      }
      @media print {
        body { background: white; padding: 0; }
        .cv-toolbar { display: none; }
        .page {
          box-shadow: none;
          border: none;
          border-radius: 0;
          padding: 1.5rem 1.75rem 1rem;
          max-width: none;
        }
        .cv-photo { width: 108px; height: 108px; }
        .cv-top { grid-template-columns: 108px 1fr; margin-bottom: 1.1rem; }
        .cv-block { margin-bottom: 0.65rem; break-inside: auto; page-break-inside: auto; }
        .cv-block--section-head { margin-bottom: 0.3rem; }
        .cv-row,
        .cv-top,
        .lang-row {
          break-inside: avoid;
          page-break-inside: avoid;
        }
        .cv-main { padding-bottom: 0.4rem; }
        .tl-desc {
          orphans: 3;
          widows: 3;
        }
        a { color: var(--accent-dark) !important; text-decoration: none; }
        * {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
      @media (max-width: 640px) {
        :root {
          --aside-w: 108px;
          --main-gap: 0.75rem;
        }
        .page { padding: 1.25rem 1rem; }
        .cv-top {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .cv-photo { margin: 0 auto; }
        .cv-contact-list { align-items: center; }
        .cv-flow::before { display: none; }
        .cv-row {
          grid-template-columns: var(--rail-w) 1fr;
        }
        .cv-aside {
          grid-column: 2;
          text-align: left;
          padding-right: 0;
          padding-left: 0;
        }
        .cv-rail { grid-row: 1; grid-column: 1; }
        .cv-main { grid-column: 2; padding-left: 0.65rem; }
        .cv-dot { left: 0; transform: none; }
        .skills-cols { grid-template-columns: 1fr; }
        .lang-row {
          grid-template-columns: 1fr;
          gap: 0.35rem;
        }
        .cv-toolbar__inner {
          flex-direction: column;
          align-items: stretch;
          padding: 0.75rem;
        }
        .cv-toolbar__back {
          justify-content: center;
        }
        .cv-toolbar__langs {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .cv-toolbar__actions {
          flex-direction: column;
          width: 100%;
        }
        .cv-toolbar__print {
          justify-content: center;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="cv-toolbar" id="toolbar">
      <div class="cv-toolbar__inner">
        <a class="cv-toolbar__back" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Portfolio
        </a>
        <div class="cv-toolbar__langs" id="toolbar-langs" role="group" aria-label="Language"></div>
        <div class="cv-toolbar__actions">
          <button type="button" class="cv-toolbar__print cv-toolbar__print--ghost" id="toolbar-print">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
              <rect x="6" y="14" width="12" height="8"/>
            </svg>
            Print
          </button>
          <button type="button" class="cv-toolbar__print" id="toolbar-save-pdf">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 3v12M8 11l4 4 4-4"/>
              <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
            </svg>
            Save PDF
          </button>
        </div>
      </div>
    </header>
    <article class="page" id="cv-root"></article>

    <script src="/vendor/html2canvas.min.js"></script>
    <script src="/vendor/jspdf.umd.min.js"></script>
    <script src="/cv-data.js"></script>
    <script>
      const CONTACT = {
        address: 'Blyglansvägen 12, 30259 Halmstad',
        phone: '070-791 24 57',
        phoneHref: '+46707912457',
        email: 'editorjakupi@outlook.com',
        portfolio: 'https://editor-jakupi-portfolio.onrender.com',
        linkedin: 'https://www.linkedin.com/in/editorjakupi/',
        github: 'https://github.com/editorjakupi',
      };

      const UI = {
        en: {
          websites: 'Websites & profiles',
          references: 'Custom',
          referencesNote: 'References available upon request.',
          drivingLicence: 'Driving licence B',
          proficient: 'Proficient',
        },
        sv: {
          websites: 'Webb & profiler',
          references: 'Referenser',
          referencesNote: 'Referenser lämnas på begäran.',
          drivingLicence: 'Körkort B',
          proficient: 'Proficient',
        },
        de: {
          websites: 'Websites, Portfolios, Profile',
          references: 'Referenzen',
          referencesNote: 'Referenzen auf Anfrage.',
          drivingLicence: 'Führerschein B',
          proficient: 'Proficient',
        },
        fr: {
          websites: 'Sites, portfolios, profils',
          references: 'Références',
          referencesNote: 'Références disponibles sur demande.',
          drivingLicence: 'Permis B',
          proficient: 'Proficient',
        },
        es: {
          websites: 'Webs, portfolios, perfiles',
          references: 'Referencias',
          referencesNote: 'Referencias disponibles bajo solicitud.',
          drivingLicence: 'Carnet B',
          proficient: 'Proficient',
        },
        it: {
          websites: 'Siti, portfolio, profili',
          references: 'Referenze',
          referencesNote: 'Referenze disponibili su richiesta.',
          drivingLicence: 'Patente B',
          proficient: 'Proficient',
        },
        pl: {
          websites: 'Strony, portfolio, profile',
          references: 'Referencje',
          referencesNote: 'Referencje dostępne na życzenie.',
          drivingLicence: 'Prawo jazdy B',
          proficient: 'Proficient',
        },
        sq: {
          websites: 'Faqe, portofol, profile',
          references: 'Referencat',
          referencesNote: 'Referencat ofrohen me kërkesë.',
          drivingLicence: 'Patentë shoferi B',
          proficient: 'Proficient',
        },
      };

      function ui(lang) {
        return UI[lang] || UI.en;
      }

      function section(label, content) {
        return `
          <div class="cv-block">
            <div class="cv-row">
              <div class="cv-aside"><h2>${label}</h2></div>
              <div class="cv-rail" aria-hidden="true"><span class="cv-dot"></span></div>
              <div class="cv-main">${content}</div>
            </div>
          </div>`;
      }

      function timelineSection(label, items) {
        const head = `
          <div class="cv-block cv-block--section-head">
            <div class="cv-row">
              <div class="cv-aside"><h2>${label}</h2></div>
              <div class="cv-rail" aria-hidden="true"><span class="cv-dot"></span></div>
              <div class="cv-main cv-main--spacer"></div>
            </div>
          </div>`;
        const entries = items
          .map(
            (item) => `
          <div class="cv-block cv-block--entry">
            <div class="cv-row">
              <div class="cv-aside cv-date">${item.period}</div>
              <div class="cv-rail" aria-hidden="true"><span class="cv-dot"></span></div>
              <div class="cv-main">
                <p class="tl-role">${item.title}</p>
                ${item.sub ? `<p class="tl-org">${item.sub}</p>` : ''}
                ${item.desc ? `<p class="tl-desc">${item.desc}</p>` : ''}
              </div>
            </div>
          </div>`,
          )
          .join('');
        return `${head}${entries}`;
      }

      function languageRow(label, proficientLabel) {
        const match = label.match(/^(.+?)\s*\((C\d)\)$/i);
        const name = match ? match[1].trim() : label;
        const level = match ? match[2].toUpperCase() : '';
        const filled = level === 'C2' ? 8 : level === 'C1' ? 6 : level === 'B2' ? 4 : 3;
        const blocks = Array.from({ length: 8 }, (_, i) =>
          `<span class="lang-block${i < filled ? ' filled' : ''}"></span>`,
        ).join('');
        const levelText = level ? `${level} ${proficientLabel}` : label;
        return `
          <div class="lang-row">
            <span class="lang-name">${name}</span>
            <div class="lang-bars" aria-hidden="true">${blocks}</div>
            <span class="lang-level">${levelText}</span>
          </div>`;
      }

      function splitSkills(skills) {
        const mid = Math.ceil(skills.length / 2);
        return [skills.slice(0, mid), skills.slice(mid)];
      }

      function renderCv(lang) {
        const data = window.CV_DATA.entries[lang];
        const s = data.sections;
        const labels = ui(lang);
        const [skillsLeft, skillsRight] = splitSkills(data.skills);

        document.documentElement.lang = lang;
        document.getElementById('cv-root').innerHTML = `
          <header class="cv-top">
            <img class="cv-photo" src="/me.jpg" alt="Editor Jakupi" width="108" height="108" />
            <div>
              <h1 class="cv-name">EDITOR JAKUPI</h1>
              <ul class="cv-contact-list">
                <li><span class="cv-icon">⌂</span><span>${CONTACT.address}</span></li>
                <li><span class="cv-icon">☎</span><a href="tel:${CONTACT.phoneHref}">${CONTACT.phone}</a></li>
                <li><span class="cv-icon">✉</span><a href="mailto:${CONTACT.email}">${CONTACT.email}</a></li>
                <li><span class="cv-icon">⛟</span><span>${labels.drivingLicence}</span></li>
              </ul>
            </div>
          </header>

          <div class="cv-flow">
            ${section(s.profile, `<p>${data.profile}</p>`)}

            ${section(
              s.languages,
              data.spokenLanguages.map((l) => languageRow(l, labels.proficient)).join(''),
            )}

            ${section(
              labels.websites,
              `<ul class="link-list">
                <li><a href="${CONTACT.portfolio}">editor-jakupi-portfolio.onrender.com</a></li>
                <li><a href="${CONTACT.linkedin}">www.linkedin.com/in/editorjakupi/</a></li>
                <li><a href="${CONTACT.github}">github.com/editorjakupi</a></li>
              </ul>`,
            )}

            ${section(
              s.skills,
              `<div class="skills-cols">
                <ul>${skillsLeft.map((skill) => `<li>${skill}</li>`).join('')}</ul>
                <ul>${skillsRight.map((skill) => `<li>${skill}</li>`).join('')}</ul>
              </div>`,
            )}

            ${section(labels.references, `<p>${labels.referencesNote}</p>`)}

            ${timelineSection(s.experience, data.experience)}

            ${timelineSection(s.education, data.education)}
          </div>`;
      }

      async function waitForImages(root) {
        const images = [...root.querySelectorAll('img')];
        await Promise.all(
          images.map(
            (img) =>
              new Promise((resolve) => {
                if (img.complete) resolve();
                else {
                  img.onload = () => resolve();
                  img.onerror = () => resolve();
                }
              }),
          ),
        );
      }

      function renderPhotoDataUrl(img) {
        if (!img || !img.complete || !img.naturalWidth) return null;
        const canvas = document.createElement('canvas');
        const size = 432;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        const nw = img.naturalWidth;
        const nh = img.naturalHeight;
        const side = Math.min(nw, nh);
        let sx = (nw - side) / 2;
        let sy = Math.max(0, (nh - side) * 0.85);
        if (sy + side > nh) sy = nh - side;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        return canvas.toDataURL('image/jpeg', 0.98);
      }

      async function buildExportNode() {
        const page = document.querySelector('.page');
        await waitForImages(page);

        const photoData = renderPhotoDataUrl(document.querySelector('.cv-photo'));
        const wrapper = document.createElement('div');
        wrapper.className = 'pdf-export-root';
        wrapper.style.cssText =
          'position:absolute;left:-9999px;top:0;background:#fff;overflow:visible;';

        const clone = page.cloneNode(true);
        clone.classList.add('page--export');

        const photo = clone.querySelector('.cv-photo');
        if (photo && photoData) {
          photo.src = photoData;
          photo.style.width = '108px';
          photo.style.height = '108px';
          photo.style.objectFit = 'cover';
          photo.style.objectPosition = 'center 90%';
          photo.style.borderRadius = '4px';
        }

        wrapper.appendChild(clone);
        document.body.appendChild(wrapper);
        wrapper.style.width = `${clone.offsetWidth}px`;

        await waitForImages(clone);
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        return { wrapper, clone };
      }

      function getJsPDF() {
        if (window.jspdf?.jsPDF) return window.jspdf.jsPDF;
        if (typeof window.jsPDF === 'function') return window.jsPDF;
        throw new Error('jsPDF not loaded');
      }

      function collectBlockRanges(clone) {
        const cloneRect = clone.getBoundingClientRect();
        return [...clone.querySelectorAll('.cv-top, .cv-block')].map((el) => {
          const r = el.getBoundingClientRect();
          return {
            top: r.top - cloneRect.top,
            bottom: r.bottom - cloneRect.top,
            height: r.height,
          };
        });
      }

      function collectLinks(clone) {
        const cloneRect = clone.getBoundingClientRect();
        return [...clone.querySelectorAll('a[href]')].map((el) => {
          const r = el.getBoundingClientRect();
          return {
            href: el.href,
            top: r.top - cloneRect.top,
            left: r.left - cloneRect.left,
            width: r.width,
            height: r.height,
            bottom: r.bottom - cloneRect.top,
          };
        });
      }

      function buildPageSlices(totalCssH, maxCssPageH, blocks) {
        const slices = [];
        let pageStart = 0;

        while (pageStart < totalCssH - 0.5) {
          let pageEnd = Math.min(pageStart + maxCssPageH, totalCssH);

          for (const block of blocks) {
            const cutsThroughBlock =
              pageEnd > block.top + 4 && pageEnd < block.bottom - 4 && block.height <= maxCssPageH;
            if (cutsThroughBlock) {
              pageEnd = block.top;
              break;
            }
          }

          if (pageEnd <= pageStart + 4) {
            pageEnd = Math.min(pageStart + maxCssPageH, totalCssH);
          }

          slices.push({ startCss: pageStart, endCss: pageEnd });
          pageStart = pageEnd;
        }

        return slices;
      }

      function addLinksForSlice(pdf, links, slice, margin, contentW, cssWidth, sliceH_mm) {
        const cssSliceH = slice.endCss - slice.startCss;
        if (cssSliceH <= 0) return;

        const mmPerCssX = contentW / cssWidth;
        const mmPerCssY = sliceH_mm / cssSliceH;

        links.forEach((link) => {
          if (link.bottom <= slice.startCss || link.top >= slice.endCss) return;

          const x = margin + link.left * mmPerCssX;
          const y = margin + (link.top - slice.startCss) * mmPerCssY;
          const w = Math.max(link.width * mmPerCssX, 1);
          const h = Math.max(link.height * mmPerCssY, 1);

          pdf.link(x, y, w, h, { url: link.href });
        });
      }

      function collectTextRuns(clone) {
        const cloneRect = clone.getBoundingClientRect();
        const runs = [];
        const elements = clone.querySelectorAll(
          'h1, h2, h3, p, li, span.lang-name, span.lang-level, a, .cv-aside.cv-date, .tl-role, .tl-org, .tl-desc, .cv-contact-list span, .cv-contact-list a',
        );

        elements.forEach((el) => {
          const style = window.getComputedStyle(el);
          if (style.display === 'none' || style.visibility === 'hidden') return;

          const text = el.textContent.replace(/\s+/g, ' ').trim();
          if (!text) return;

          const bold = parseInt(style.fontWeight, 10) >= 600 || style.fontWeight === 'bold';
          const fontSize = parseFloat(style.fontSize) || 12;
          const range = document.createRange();
          range.selectNodeContents(el);
          const rects = [...range.getClientRects()].filter((r) => r.width > 0 && r.height > 0);

          if (rects.length <= 1) {
            const rect = rects[0] || el.getBoundingClientRect();
            runs.push({
              text,
              top: rect.top - cloneRect.top,
              left: rect.left - cloneRect.left,
              width: rect.width,
              height: rect.height,
              bottom: rect.bottom - cloneRect.top,
              fontSize,
              bold,
            });
            return;
          }

          const totalWidth = rects.reduce((sum, r) => sum + r.width, 0);
          const words = text.split(' ');
          let wordIdx = 0;

          rects.forEach((rect) => {
            const targetChars = Math.max(
              1,
              Math.round(text.length * (rect.width / Math.max(totalWidth, 1))),
            );
            let lineText = '';
            while (wordIdx < words.length && (lineText.length < targetChars || !lineText)) {
              lineText += (lineText ? ' ' : '') + words[wordIdx++];
            }
            lineText = lineText.trim();
            if (!lineText) return;

            runs.push({
              text: lineText,
              top: rect.top - cloneRect.top,
              left: rect.left - cloneRect.left,
              width: rect.width,
              height: rect.height,
              bottom: rect.bottom - cloneRect.top,
              fontSize,
              bold,
            });
          });
        });

        return runs;
      }

      function addSelectableTextForSlice(pdf, runs, slice, margin, contentW, cssWidth, sliceH_mm) {
        const cssSliceH = slice.endCss - slice.startCss;
        if (cssSliceH <= 0 || !runs.length) return;

        const mmPerCssX = contentW / cssWidth;
        const mmPerCssY = sliceH_mm / cssSliceH;

        pdf.saveGraphicsState();
        pdf.internal.write('3 Tr\n');

        runs.forEach((run) => {
          if (run.bottom <= slice.startCss || run.top >= slice.endCss) return;

          const x = margin + run.left * mmPerCssX;
          const y = margin + (run.top - slice.startCss + run.height * 0.8) * mmPerCssY;
          const fontPt = Math.max(4, (run.fontSize * mmPerCssX) / 0.352778);

          pdf.setFont('helvetica', run.bold ? 'bold' : 'normal');
          pdf.setFontSize(fontPt);
          pdf.text(run.text, x, y, { maxWidth: Math.max(run.width * mmPerCssX, 1) });
        });

        pdf.internal.write('0 Tr\n');
        pdf.restoreGraphicsState();
      }

      async function generatePdfDocument() {
        if (typeof html2canvas !== 'function') {
          throw new Error('html2canvas not loaded');
        }

        window.scrollTo(0, 0);
        let exportRoot = null;

        try {
          const { wrapper, clone } = await buildExportNode();
          exportRoot = wrapper;

          const exportW = clone.offsetWidth;
          const exportH = clone.scrollHeight;
          const blocks = collectBlockRanges(clone);
          const links = collectLinks(clone);
          const textRuns = collectTextRuns(clone);
          const scale = 2;

          const canvas = await html2canvas(clone, {
            scale,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#ffffff',
            logging: false,
            scrollX: 0,
            scrollY: 0,
            windowWidth: exportW,
            windowHeight: exportH,
          });

          const jsPDF = getJsPDF();
          const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
          const pageW = pdf.internal.pageSize.getWidth();
          const pageH = pdf.internal.pageSize.getHeight();
          const margin = 8;
          const contentW = pageW - margin * 2;
          const contentH_mm = pageH - margin * 2;
          const cssTotalH = canvas.height / scale;
          const cssTotalW = canvas.width / scale;
          const imgH_mm = (canvas.height * contentW) / canvas.width;
          const maxCssPageH = cssTotalH * (contentH_mm / imgH_mm);
          const slices = buildPageSlices(cssTotalH, maxCssPageH, blocks);

          slices.forEach((slice, index) => {
            if (index > 0) pdf.addPage();

            const startPx = Math.round(slice.startCss * scale);
            const sliceHPx = Math.max(1, Math.round((slice.endCss - slice.startCss) * scale));
            const sliceCanvas = document.createElement('canvas');
            sliceCanvas.width = canvas.width;
            sliceCanvas.height = sliceHPx;
            const ctx = sliceCanvas.getContext('2d');
            ctx.drawImage(canvas, 0, startPx, canvas.width, sliceHPx, 0, 0, canvas.width, sliceHPx);

            const sliceH_mm = (sliceHPx * contentW) / canvas.width;
            pdf.addImage(sliceCanvas.toDataURL('image/jpeg', 0.98), 'JPEG', margin, margin, contentW, sliceH_mm);
            addLinksForSlice(pdf, links, slice, margin, contentW, cssTotalW, sliceH_mm);
            addSelectableTextForSlice(pdf, textRuns, slice, margin, contentW, cssTotalW, sliceH_mm);
          });

          return pdf;
        } finally {
          if (exportRoot) exportRoot.remove();
        }
      }

      function setPdfButtonsBusy(busy, label) {
        const printBtn = document.getElementById('toolbar-print');
        const saveBtn = document.getElementById('toolbar-save-pdf');
        printBtn.disabled = busy;
        saveBtn.disabled = busy;
        if (label) saveBtn.textContent = label;
      }

      async function savePdf() {
        const saveBtn = document.getElementById('toolbar-save-pdf');
        const stored = localStorage.getItem('cv-lang') || 'en';
        const originalSaveHtml = saveBtn.innerHTML;

        setPdfButtonsBusy(true, 'Generating PDF…');

        try {
          const pdf = await generatePdfDocument();
          pdf.save(`Editor-Jakupi-CV-${stored}.pdf`);
        } catch {
          alert('Could not generate PDF. Check your connection and try again.');
        } finally {
          setPdfButtonsBusy(false);
          saveBtn.innerHTML = originalSaveHtml;
        }
      }

      async function printCv() {
        const printBtn = document.getElementById('toolbar-print');
        const originalPrintHtml = printBtn.innerHTML;

        setPdfButtonsBusy(true);
        printBtn.textContent = 'Preparing…';

        try {
          const pdf = await generatePdfDocument();
          const blob = pdf.output('blob');
          const url = URL.createObjectURL(blob);
          const printWindow = window.open(url, '_blank');

          if (!printWindow) {
            URL.revokeObjectURL(url);
            alert('Allow popups to print your CV, or use Save PDF instead.');
            return;
          }

          const triggerPrint = () => {
            try {
              printWindow.focus();
              printWindow.print();
            } catch {
              /* PDF viewer may require manual print */
            }
          };

          printWindow.addEventListener('load', triggerPrint);
          setTimeout(triggerPrint, 900);
          setTimeout(() => URL.revokeObjectURL(url), 120000);
        } catch {
          alert('Could not prepare print. Try Save PDF instead.');
        } finally {
          setPdfButtonsBusy(false);
          printBtn.innerHTML = originalPrintHtml;
        }
      }

      function init() {
        const langGroup = document.getElementById('toolbar-langs');
        const printBtn = document.getElementById('toolbar-print');
        const saveBtn = document.getElementById('toolbar-save-pdf');
        const stored = localStorage.getItem('cv-lang');
        let active = stored && window.CV_DATA.entries[stored] ? stored : 'en';

        window.CV_DATA.langs.forEach(({ code, label }) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = label;
          btn.dataset.lang = code;
          btn.setAttribute('aria-pressed', code === active ? 'true' : 'false');
          btn.addEventListener('click', () => {
            active = code;
            localStorage.setItem('cv-lang', code);
            langGroup.querySelectorAll('button[data-lang]').forEach((b) => {
              b.classList.remove('active');
              b.setAttribute('aria-pressed', 'false');
            });
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', 'true');
            renderCv(code);
          });
          if (code === active) btn.classList.add('active');
          langGroup.appendChild(btn);
        });

        printBtn.addEventListener('click', () => printCv());
        saveBtn.addEventListener('click', () => savePdf());

        renderCv(active);
      }

      init();
    </script>
  </body>
</html>
