<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor Jakupi — CV</title>
    <style>
      :root {
        --text: #111827;
        --muted: #4b5563;
        --accent: #0f766e;
        --border: #e5e7eb;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: var(--text);
        line-height: 1.5;
        background: #f8fafc;
        padding: 2rem 1rem;
      }
      .toolbar {
        max-width: 820px;
        margin: 0 auto 1rem;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .toolbar button, .toolbar a {
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: white;
        text-decoration: none;
        color: var(--text);
        cursor: pointer;
        font: inherit;
      }
      .toolbar button.active {
        background: #ccfbf1;
        border-color: #5eead4;
        color: var(--accent);
        font-weight: 600;
      }
      .page {
        max-width: 820px;
        margin: 0 auto;
        background: white;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 2.5rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1.5rem;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 1rem;
        margin-bottom: 1.5rem;
      }
      .cv-header-main {
        flex: 1;
        min-width: 0;
      }
      .cv-photo {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        object-position: center 90%;
        border: 2px solid var(--accent);
        flex-shrink: 0;
        background: #f1f5f9;
        transition: transform 0.4s ease, box-shadow 0.4s ease;
        cursor: pointer;
      }
      .cv-photo:hover {
        transform: scale(1.06) rotate(-3deg);
        box-shadow: 0 8px 24px rgba(15, 118, 110, 0.22);
      }
      h1 { font-size: 2rem; letter-spacing: -0.02em; }
      .subtitle { color: var(--accent); font-weight: 600; margin-top: 0.25rem; }
      .contact { margin-top: 0.75rem; color: var(--muted); font-size: 0.92rem; }
      .contact a { color: var(--accent); }
      h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--accent);
        margin: 1.5rem 0 0.75rem;
      }
      .entry { margin-bottom: 1rem; }
      .entry-head {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        font-weight: 600;
      }
      .entry-period { color: var(--muted); font-weight: 600; white-space: nowrap; }
      .entry-sub { color: var(--muted); font-size: 0.92rem; margin: 0.15rem 0 0.35rem; }
      .entry p { color: var(--muted); font-size: 0.95rem; }
      .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
      .tag {
        font-size: 0.78rem;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        background: #f1f5f9;
        color: #334155;
      }
      ul.compact { padding-left: 1.1rem; color: var(--muted); font-size: 0.95rem; }
      ul.compact li { margin-bottom: 0.25rem; }
      @media print {
        body { background: white; padding: 0; }
        .toolbar { display: none; }
        .page { box-shadow: none; border: none; border-radius: 0; padding: 0; max-width: none; }
        .cv-photo { width: 84px; height: 84px; }
      }
      @media (max-width: 520px) {
        header { flex-direction: column-reverse; align-items: center; text-align: center; }
        .cv-photo { width: 88px; height: 88px; }
      }
    </style>
  </head>
  <body>
    <div class="toolbar" id="toolbar"></div>
    <article class="page" id="cv-root"></article>

    <script src="/cv-data.js"></script>
    <script>
      const CONTACT = {
        address: 'Blyglansvägen 12, 30259 Halmstad',
        phone: '070-791 24 57',
        phoneHref: '+46707912457',
        email: 'editorjakupi@outlook.com',
        linkedin: 'https://www.linkedin.com/in/editorjakupi/',
        github: 'https://github.com/editorjakupi',
      };

      function renderEntry(item) {
        return `
          <div class="entry">
            <div class="entry-head">
              <span>${item.title}</span>
              <span class="entry-period">${item.period}</span>
            </div>
            ${item.sub ? `<p class="entry-sub">${item.sub}</p>` : ''}
            ${item.desc ? `<p>${item.desc}</p>` : ''}
          </div>`;
      }

      function renderCv(lang) {
        const data = window.CV_DATA.entries[lang];
        const s = data.sections;
        document.documentElement.lang = lang;
        document.getElementById('cv-root').innerHTML = `
          <header>
            <div class="cv-header-main">
              <h1>Editor Jakupi</h1>
              <p class="subtitle">${data.subtitle}</p>
              <p class="contact">
                ${CONTACT.address} ·
                <a href="tel:${CONTACT.phoneHref}">${CONTACT.phone}</a> ·
                <a href="mailto:${CONTACT.email}">${CONTACT.email}</a> ·
                <a href="${CONTACT.linkedin}">LinkedIn</a> ·
                <a href="${CONTACT.github}">GitHub</a> ·
                Driving licence B
              </p>
            </div>
            <img class="cv-photo" src="/me.jpg" alt="Editor Jakupi" width="96" height="96" />
          </header>
          <h2>${s.profile}</h2>
          <p style="color:#4b5563;margin-bottom:1rem;">${data.profile}</p>
          <h2>${s.experience}</h2>
          ${data.experience.map(renderEntry).join('')}
          <h2>${s.education}</h2>
          ${data.education.map(renderEntry).join('')}
          <h2>${s.skills}</h2>
          <div class="tags">${data.skills.map((t) => `<span class="tag">${t}</span>`).join('')}</div>
          <h2>${s.languages}</h2>
          <ul class="compact">${data.spokenLanguages.map((l) => `<li>${l}</li>`).join('')}</ul>
          <h2>${s.interests}</h2>
          <ul class="compact">${data.interests.map((l) => `<li>${l}</li>`).join('')}</ul>
          <h2>${s.traits}</h2>
          <ul class="compact">${data.traits.map((l) => `<li>${l}</li>`).join('')}</ul>`;
      }

      function init() {
        const toolbar = document.getElementById('toolbar');
        const stored = localStorage.getItem('cv-lang');
        let active = stored && window.CV_DATA.entries[stored] ? stored : 'en';

        window.CV_DATA.langs.forEach(({ code, label }) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = label;
          btn.dataset.lang = code;
          btn.addEventListener('click', () => {
            active = code;
            localStorage.setItem('cv-lang', code);
            toolbar.querySelectorAll('button[data-lang]').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            renderCv(code);
          });
          if (code === active) btn.classList.add('active');
          toolbar.appendChild(btn);
        });

        const printBtn = document.createElement('button');
        printBtn.type = 'button';
        printBtn.textContent = 'Print / Save PDF';
        printBtn.addEventListener('click', () => window.print());
        toolbar.appendChild(printBtn);

        const back = document.createElement('a');
        back.href = '/';
        back.textContent = '← Portfolio';
        toolbar.appendChild(back);

        renderCv(active);
      }

      init();
    </script>
  </body>
</html>
