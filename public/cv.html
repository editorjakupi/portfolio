<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor Jakupi — CV</title>
    <style>
      :root {
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0d9488;
        --accent-dark: #0f766e;
        --line: #cbd5e1;
        --border: #e5e7eb;
        --aside-w: 136px;
        --rail-w: 20px;
        --main-gap: 1.15rem;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: var(--text);
        line-height: 1.55;
        background: #eef2f6;
        padding: 2rem 1rem 3rem;
      }
      .cv-toolbar {
        max-width: 900px;
        margin: 0 auto 1.25rem;
        position: sticky;
        top: 0.75rem;
        z-index: 20;
      }
      .cv-toolbar__inner {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 0.55rem 0.65rem 0.55rem 0.85rem;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
        backdrop-filter: blur(10px);
      }
      .cv-toolbar__back {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        flex-shrink: 0;
        padding: 0.45rem 0.65rem;
        border-radius: 10px;
        font-size: 0.84rem;
        font-weight: 500;
        color: var(--muted);
        text-decoration: none;
        transition: color 0.15s, background 0.15s;
      }
      .cv-toolbar__back:hover {
        color: var(--accent-dark);
        background: #f0fdfa;
      }
      .cv-toolbar__back svg {
        width: 1rem;
        height: 1rem;
        flex-shrink: 0;
      }
      .cv-toolbar__langs {
        display: flex;
        flex: 1;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.2rem;
        padding: 0.28rem;
        background: #f1f5f9;
        border-radius: 11px;
        border: 1px solid #e2e8f0;
        min-width: 0;
      }
      .cv-toolbar__langs button {
        padding: 0.38rem 0.72rem;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.8rem;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.15s, background 0.15s, box-shadow 0.15s;
      }
      .cv-toolbar__langs button:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.65);
      }
      .cv-toolbar__langs button.active {
        background: white;
        color: var(--accent-dark);
        font-weight: 600;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      }
      .cv-toolbar__print {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        flex-shrink: 0;
        padding: 0.52rem 0.95rem;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
        color: white;
        font: inherit;
        font-size: 0.84rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(13, 148, 136, 0.28);
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .cv-toolbar__print:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(13, 148, 136, 0.34);
      }
      .cv-toolbar__print svg {
        width: 1rem;
        height: 1rem;
        flex-shrink: 0;
      }
      .page {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2.25rem 2rem 2.5rem 1.75rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      /* Header — photo left, name + contact right */
      .cv-top {
        display: grid;
        grid-template-columns: 108px 1fr;
        gap: 1.5rem;
        align-items: start;
        margin-bottom: 2rem;
        padding-bottom: 0.25rem;
      }
      .cv-photo {
        width: 108px;
        height: 108px;
        object-fit: cover;
        object-position: center 90%;
        border-radius: 4px;
        background: #f1f5f9;
        display: block;
      }
      .cv-name {
        font-size: 2.15rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--accent);
        line-height: 1.1;
        margin-bottom: 0.85rem;
      }
      .cv-contact-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        font-size: 0.88rem;
        color: var(--muted);
      }
      .cv-contact-list li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .cv-contact-list a {
        color: var(--accent-dark);
        text-decoration: none;
      }
      .cv-contact-list a:hover { text-decoration: underline; }
      .cv-icon {
        width: 1rem;
        text-align: center;
        color: var(--accent);
        flex-shrink: 0;
        font-size: 0.82rem;
      }

      /* Timeline — aside (labels/dates) | rail (line + dot) | main (content) */
      .cv-flow {
        position: relative;
      }
      .cv-flow::before {
        content: '';
        position: absolute;
        left: calc(var(--aside-w) + var(--rail-w) / 2 - 1px);
        top: 0.5rem;
        bottom: 0;
        width: 2px;
        background: var(--line);
        z-index: 0;
      }
      .cv-row {
        display: grid;
        grid-template-columns: var(--aside-w) var(--rail-w) 1fr;
        column-gap: 0;
        align-items: start;
      }
      .cv-block {
        margin-bottom: 1.65rem;
      }
      .cv-block:last-child {
        margin-bottom: 0;
      }
      .cv-aside {
        text-align: right;
        padding-right: 0.7rem;
        padding-top: 0.15rem;
      }
      .cv-aside h2 {
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--accent);
        line-height: 1.3;
      }
      .cv-aside.cv-date {
        font-size: 0.76rem;
        color: var(--muted);
        font-weight: 400;
        line-height: 1.35;
        padding-top: 0.2rem;
      }
      .cv-rail {
        position: relative;
        width: var(--rail-w);
        min-height: 1.25rem;
      }
      .cv-dot {
        position: absolute;
        left: 50%;
        top: 0.38rem;
        transform: translateX(-50%);
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px white;
        z-index: 2;
      }
      .cv-main {
        font-size: 0.92rem;
        color: var(--muted);
        padding-left: var(--main-gap);
        padding-top: 0.1rem;
        padding-bottom: 1.15rem;
        min-width: 0;
      }
      .cv-row:last-child .cv-main,
      .cv-block .cv-row:last-child .cv-main {
        padding-bottom: 0;
      }
      .cv-main p { margin-bottom: 0.5rem; }
      .cv-main p:last-child { margin-bottom: 0; }
      .cv-main--spacer {
        padding-bottom: 0.35rem;
        min-height: 0;
      }

      /* Languages with C2 bars */
      .lang-row {
        display: grid;
        grid-template-columns: 7rem 1fr auto;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.55rem;
        font-size: 0.88rem;
      }
      .lang-row:last-child { margin-bottom: 0; }
      .lang-name { color: var(--text); font-weight: 500; }
      .lang-bars {
        display: flex;
        gap: 2px;
        height: 13px;
        align-items: stretch;
        max-width: 220px;
      }
      .lang-block {
        flex: 1;
        min-width: 0;
        max-width: 22px;
        background: #e5e7eb;
        border-radius: 1px;
      }
      .lang-block.filled { background: var(--accent); }
      .lang-level {
        font-size: 0.78rem;
        color: var(--muted);
        white-space: nowrap;
      }

      /* Links list */
      .link-list { list-style: none; }
      .link-list li { margin-bottom: 0.35rem; }
      .link-list a {
        color: var(--accent-dark);
        text-decoration: none;
        word-break: break-all;
      }
      .link-list a:hover { text-decoration: underline; }

      /* Skills — two columns like PDF */
      .skills-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.35rem 2rem;
        font-size: 0.86rem;
        color: var(--text);
      }
      .skills-cols ul {
        list-style: disc;
        padding-left: 1.15rem;
      }
      .skills-cols li {
        margin-bottom: 0.22rem;
        padding-left: 0.1rem;
      }

      /* Experience / education — dates in aside column (left of line) */
      .tl-role {
        font-weight: 600;
        color: var(--text);
        font-size: 0.92rem;
        margin-bottom: 0.15rem;
      }
      .tl-org {
        font-size: 0.86rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      .tl-desc {
        font-size: 0.88rem;
        line-height: 1.55;
      }

      @media print {
        body { background: white; padding: 0; }
        .cv-toolbar { display: none; }
        .page {
          box-shadow: none;
          border: none;
          border-radius: 0;
          padding: 0;
          max-width: none;
        }
        .cv-photo { width: 96px; height: 96px; }
        .cv-top { grid-template-columns: 96px 1fr; }
      }
      @media (max-width: 640px) {
        :root {
          --aside-w: 108px;
          --main-gap: 0.75rem;
        }
        .page { padding: 1.25rem 1rem; }
        .cv-top {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .cv-photo { margin: 0 auto; }
        .cv-contact-list { align-items: center; }
        .cv-flow::before { display: none; }
        .cv-row {
          grid-template-columns: var(--rail-w) 1fr;
        }
        .cv-aside {
          grid-column: 2;
          text-align: left;
          padding-right: 0;
          padding-left: 0;
        }
        .cv-rail { grid-row: 1; grid-column: 1; }
        .cv-main { grid-column: 2; padding-left: 0.65rem; }
        .cv-dot { left: 0; transform: none; }
        .skills-cols { grid-template-columns: 1fr; }
        .lang-row {
          grid-template-columns: 1fr;
          gap: 0.35rem;
        }
        .cv-toolbar { position: static; }
        .cv-toolbar__inner {
          flex-direction: column;
          align-items: stretch;
          padding: 0.75rem;
        }
        .cv-toolbar__back {
          justify-content: center;
        }
        .cv-toolbar__langs {
          justify-content: flex-start;
          overflow-x: auto;
          flex-wrap: nowrap;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
        }
        .cv-toolbar__langs::-webkit-scrollbar { display: none; }
        .cv-toolbar__print {
          justify-content: center;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="cv-toolbar" id="toolbar">
      <div class="cv-toolbar__inner">
        <a class="cv-toolbar__back" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Portfolio
        </a>
        <div class="cv-toolbar__langs" id="toolbar-langs" role="group" aria-label="Language"></div>
        <button type="button" class="cv-toolbar__print" id="toolbar-print">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
          Print / Save PDF
        </button>
      </div>
    </header>
    <article class="page" id="cv-root"></article>

    <script src="/cv-data.js"></script>
    <script>
      const CONTACT = {
        address: 'Blyglansvägen 12, 30259 Halmstad',
        phone: '070-791 24 57',
        phoneHref: '+46707912457',
        email: 'editorjakupi@outlook.com',
        portfolio: 'https://editor-jakupi-portfolio.onrender.com',
        linkedin: 'https://www.linkedin.com/in/editorjakupi/',
        github: 'https://github.com/editorjakupi',
      };

      const UI = {
        en: {
          websites: 'Websites & profiles',
          references: 'Custom',
          referencesNote: 'References available upon request.',
          drivingLicence: 'Driving licence B',
          proficient: 'Proficient',
        },
        sv: {
          websites: 'Webb & profiler',
          references: 'Referenser',
          referencesNote: 'Referenser lämnas på begäran.',
          drivingLicence: 'Körkort B',
          proficient: 'Proficient',
        },
        de: {
          websites: 'Websites, Portfolios, Profile',
          references: 'Referenzen',
          referencesNote: 'Referenzen auf Anfrage.',
          drivingLicence: 'Führerschein B',
          proficient: 'Proficient',
        },
        fr: {
          websites: 'Sites, portfolios, profils',
          references: 'Références',
          referencesNote: 'Références disponibles sur demande.',
          drivingLicence: 'Permis B',
          proficient: 'Proficient',
        },
        es: {
          websites: 'Webs, portfolios, perfiles',
          references: 'Referencias',
          referencesNote: 'Referencias disponibles bajo solicitud.',
          drivingLicence: 'Carnet B',
          proficient: 'Proficient',
        },
        it: {
          websites: 'Siti, portfolio, profili',
          references: 'Referenze',
          referencesNote: 'Referenze disponibili su richiesta.',
          drivingLicence: 'Patente B',
          proficient: 'Proficient',
        },
        pl: {
          websites: 'Strony, portfolio, profile',
          references: 'Referencje',
          referencesNote: 'Referencje dostępne na życzenie.',
          drivingLicence: 'Prawo jazdy B',
          proficient: 'Proficient',
        },
        sq: {
          websites: 'Faqe, portofol, profile',
          references: 'Referencat',
          referencesNote: 'Referencat ofrohen me kërkesë.',
          drivingLicence: 'Patentë shoferi B',
          proficient: 'Proficient',
        },
      };

      function ui(lang) {
        return UI[lang] || UI.en;
      }

      function section(label, content) {
        return `
          <div class="cv-block">
            <div class="cv-row">
              <div class="cv-aside"><h2>${label}</h2></div>
              <div class="cv-rail" aria-hidden="true"><span class="cv-dot"></span></div>
              <div class="cv-main">${content}</div>
            </div>
          </div>`;
      }

      function timelineSection(label, items) {
        const head = `
          <div class="cv-row">
            <div class="cv-aside"><h2>${label}</h2></div>
            <div class="cv-rail" aria-hidden="true"><span class="cv-dot"></span></div>
            <div class="cv-main cv-main--spacer"></div>
          </div>`;
        const entries = items
          .map(
            (item) => `
          <div class="cv-row">
            <div class="cv-aside cv-date">${item.period}</div>
            <div class="cv-rail" aria-hidden="true"><span class="cv-dot"></span></div>
            <div class="cv-main">
              <p class="tl-role">${item.title}</p>
              ${item.sub ? `<p class="tl-org">${item.sub}</p>` : ''}
              ${item.desc ? `<p class="tl-desc">${item.desc}</p>` : ''}
            </div>
          </div>`,
          )
          .join('');
        return `<div class="cv-block">${head}${entries}</div>`;
      }

      function languageRow(label, proficientLabel) {
        const match = label.match(/^(.+?)\s*\((C\d)\)$/i);
        const name = match ? match[1].trim() : label;
        const level = match ? match[2].toUpperCase() : '';
        const filled = level === 'C2' ? 8 : level === 'C1' ? 6 : level === 'B2' ? 4 : 3;
        const blocks = Array.from({ length: 8 }, (_, i) =>
          `<span class="lang-block${i < filled ? ' filled' : ''}"></span>`,
        ).join('');
        const levelText = level ? `${level} ${proficientLabel}` : label;
        return `
          <div class="lang-row">
            <span class="lang-name">${name}</span>
            <div class="lang-bars" aria-hidden="true">${blocks}</div>
            <span class="lang-level">${levelText}</span>
          </div>`;
      }

      function splitSkills(skills) {
        const mid = Math.ceil(skills.length / 2);
        return [skills.slice(0, mid), skills.slice(mid)];
      }

      function renderCv(lang) {
        const data = window.CV_DATA.entries[lang];
        const s = data.sections;
        const labels = ui(lang);
        const [skillsLeft, skillsRight] = splitSkills(data.skills);

        document.documentElement.lang = lang;
        document.getElementById('cv-root').innerHTML = `
          <header class="cv-top">
            <img class="cv-photo" src="/me.jpg" alt="Editor Jakupi" width="108" height="108" />
            <div>
              <h1 class="cv-name">EDITOR JAKUPI</h1>
              <ul class="cv-contact-list">
                <li><span class="cv-icon">⌂</span><span>${CONTACT.address}</span></li>
                <li><span class="cv-icon">☎</span><a href="tel:${CONTACT.phoneHref}">${CONTACT.phone}</a></li>
                <li><span class="cv-icon">✉</span><a href="mailto:${CONTACT.email}">${CONTACT.email}</a></li>
                <li><span class="cv-icon">⛟</span><span>${labels.drivingLicence}</span></li>
              </ul>
            </div>
          </header>

          <div class="cv-flow">
            ${section(s.profile, `<p>${data.profile}</p>`)}

            ${section(
              s.languages,
              data.spokenLanguages.map((l) => languageRow(l, labels.proficient)).join(''),
            )}

            ${section(
              labels.websites,
              `<ul class="link-list">
                <li><a href="${CONTACT.portfolio}">editor-jakupi-portfolio.onrender.com</a></li>
                <li><a href="${CONTACT.linkedin}">www.linkedin.com/in/editorjakupi/</a></li>
                <li><a href="${CONTACT.github}">github.com/editorjakupi</a></li>
              </ul>`,
            )}

            ${section(
              s.skills,
              `<div class="skills-cols">
                <ul>${skillsLeft.map((skill) => `<li>${skill}</li>`).join('')}</ul>
                <ul>${skillsRight.map((skill) => `<li>${skill}</li>`).join('')}</ul>
              </div>`,
            )}

            ${section(labels.references, `<p>${labels.referencesNote}</p>`)}

            ${timelineSection(s.experience, data.experience)}

            ${timelineSection(s.education, data.education)}
          </div>`;
      }

      function init() {
        const langGroup = document.getElementById('toolbar-langs');
        const printBtn = document.getElementById('toolbar-print');
        const stored = localStorage.getItem('cv-lang');
        let active = stored && window.CV_DATA.entries[stored] ? stored : 'en';

        window.CV_DATA.langs.forEach(({ code, label }) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = label;
          btn.dataset.lang = code;
          btn.setAttribute('aria-pressed', code === active ? 'true' : 'false');
          btn.addEventListener('click', () => {
            active = code;
            localStorage.setItem('cv-lang', code);
            langGroup.querySelectorAll('button[data-lang]').forEach((b) => {
              b.classList.remove('active');
              b.setAttribute('aria-pressed', 'false');
            });
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', 'true');
            renderCv(code);
          });
          if (code === active) btn.classList.add('active');
          langGroup.appendChild(btn);
        });

        printBtn.addEventListener('click', () => window.print());

        renderCv(active);
      }

      init();
    </script>
  </body>
</html>
