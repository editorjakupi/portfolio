<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor Jakupi — CV</title>
  <style>
    :root {
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0d9488;
      --accent-dark: #0f766e;
      --line: #cbd5e1;
      --border: #e5e7eb;
      --aside-w: 136px;
      --rail-w: 20px;
      --main-gap: 1.15rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      line-height: 1.55;
      background: #eef2f6;
      padding: 2rem 1rem 3rem;
    }

    .cv-toolbar {
      max-width: 900px;
      margin: 0 auto 1.25rem;
    }

    .cv-toolbar__inner {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.55rem 0.65rem 0.55rem 0.85rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
      backdrop-filter: blur(10px);
      overflow: visible;
      position: relative;
      z-index: 20;
    }

    .cv-toolbar__back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
      padding: 0.45rem 0.65rem;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s, background 0.15s;
    }

    .cv-toolbar__back:hover {
      color: var(--accent-dark);
      background: #f0fdfa;
    }

    .cv-toolbar__back svg {
      width: 1rem;
      height: 1rem;
      flex-shrink: 0;
    }

    .cv-toolbar__langs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      flex: 1;
      gap: 0.2rem;
      padding: 0.28rem;
      background: #f1f5f9;
      border-radius: 11px;
      border: 1px solid #e2e8f0;
      min-width: 0;
    }

    .cv-toolbar__langs button {
      padding: 0.35rem 0.45rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
      transition: color 0.15s, background 0.15s, box-shadow 0.15s;
    }

    .cv-toolbar__langs button:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.65);
    }

    .cv-toolbar__langs button.active {
      background: white;
      color: var(--accent-dark);
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    .cv-toolbar__actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .cv-toolbar__print {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
      padding: 0.52rem 0.95rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: white;
      font: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.28);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .cv-toolbar__print--ghost {
      background: white;
      color: var(--accent-dark);
      border: 1px solid #99f6e4;
      box-shadow: none;
    }

    .cv-toolbar__print--ghost:hover {
      background: #f0fdfa;
      box-shadow: none;
    }

    .cv-toolbar__print:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(13, 148, 136, 0.34);
    }

    .cv-toolbar__print svg {
      width: 1rem;
      height: 1rem;
      flex-shrink: 0;
    }

    .cv-toolbar__print:disabled {
      opacity: 0.75;
      cursor: wait;
      transform: none;
    }

    .cv-toolbar__save-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .cv-toolbar__save-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 0.35rem);
      min-width: 11.5rem;
      padding: 0.35rem;
      margin: 0;
      list-style: none;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.14);
      z-index: 1000;
    }

    .cv-toolbar__save-menu.is-open {
      display: block;
    }

    .cv-toolbar__save-menu button {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.7rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
    }

    .cv-toolbar__save-menu button:hover,
    .cv-toolbar__save-menu button:focus-visible {
      background: #f0fdfa;
      color: var(--accent-dark);
      outline: none;
    }

    .cv-toolbar__save-menu button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .cv-toolbar__save-menu .fmt-ext {
      margin-left: auto;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2.25rem 2rem 2.5rem 1.75rem;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    .page.page--export {
      width: 900px;
      max-width: 900px;
      border: none;
      box-shadow: none;
      border-radius: 0;
      margin: 0;
      padding: 2.25rem 2.75rem 2.5rem 1.75rem;
      overflow: visible;
      background: #ffffff;
      box-sizing: border-box;
    }

    .page.page--export .cv-flow,
    .page.page--export .cv-main,
    .page.page--export .cv-row,
    .page.page--export .lang-row {
      overflow: visible;
    }

    .page.page--export .lang-row {
      grid-template-columns: 6rem minmax(0, 1fr) 5.75rem;
      gap: 0.5rem;
    }

    .page.page--export .lang-bars {
      max-width: 170px;
    }

    .page.page--export .lang-level {
      font-size: 0.76rem;
      text-align: right;
    }

    .page.page--export .cv-block {
      margin-bottom: 0.65rem;
    }

    .page.page--export .cv-block--section-head {
      margin-bottom: 0.35rem;
    }

    .page.page--export .cv-main {
      padding-bottom: 0.4rem;
    }

    .page.page--export .cv-top {
      margin-bottom: 1.1rem;
    }

    .page.page--export .tl-desc {
      line-height: 1.48;
    }

    .page.page--export .link-list li {
      margin-bottom: 0.2rem;
    }

    .page.page--export .lang-row {
      margin-bottom: 0.4rem;
    }

    /* Header — photo left, name + contact right */
    .cv-top {
      display: grid;
      grid-template-columns: 108px 1fr auto;
      gap: 1.5rem;
      align-items: start;
      margin-bottom: 2rem;
      padding-bottom: 0.25rem;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .cv-credentials {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.5rem;
      justify-self: end;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .cv-europass-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 84px;
      padding: 0.55rem 0.7rem;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      background: #eff6ff;
      text-decoration: none;
      font-size: 0.62rem;
      font-weight: 700;
      line-height: 1.25;
      color: #1d4ed8;
      text-align: center;
      max-width: 76px;
      letter-spacing: 0.01em;
    }

    .cv-europass-badge:hover {
      color: #1e40af;
      background: #dbeafe;
    }

    .cv-qr-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem;
      border: 1px solid #ccfbf1;
      border-radius: 10px;
      background: #f0fdfa;
      text-decoration: none;
    }

    .cv-qr-badge img {
      display: block;
      width: 76px;
      height: 76px;
      border-radius: 4px;
      background: #fff;
      padding: 2px;
    }

    .cv-photo {
      width: 108px;
      height: 108px;
      object-fit: cover;
      object-position: center 90%;
      border-radius: 4px;
      background: #f1f5f9;
      display: block;
      image-rendering: -webkit-optimize-contrast;
    }

    .cv-name {
      font-size: 2.15rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--accent);
      line-height: 1.1;
      margin-bottom: 0.85rem;
    }

    .cv-contact-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .cv-contact-list li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cv-contact-list a {
      color: var(--accent-dark);
      text-decoration: none;
    }

    .cv-contact-list a:hover {
      text-decoration: underline;
    }

    .cv-icon {
      width: 1rem;
      text-align: center;
      color: var(--accent);
      flex-shrink: 0;
      font-size: 0.82rem;
    }

    /* Timeline — aside (labels/dates) | rail (line + dot) | main (content) */
    .cv-flow {
      position: relative;
    }

    .cv-flow::before {
      content: '';
      position: absolute;
      left: calc(var(--aside-w) + var(--rail-w) / 2 - 1px);
      top: 0.5rem;
      bottom: 0;
      width: 2px;
      background: var(--line);
      z-index: 0;
    }

    .cv-row {
      display: grid;
      grid-template-columns: var(--aside-w) var(--rail-w) 1fr;
      column-gap: 0;
      align-items: start;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .cv-block {
      margin-bottom: 1.2rem;
    }

    .cv-block:last-child {
      margin-bottom: 0;
    }

    .cv-aside {
      text-align: right;
      padding-right: 0.7rem;
      padding-top: 0.15rem;
    }

    .cv-aside h2 {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.3;
    }

    .cv-aside.cv-date {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 400;
      line-height: 1.35;
      padding-top: 0.2rem;
    }

    .cv-rail {
      position: relative;
      width: var(--rail-w);
      min-height: 1.25rem;
    }

    .cv-dot {
      position: absolute;
      left: 50%;
      top: 0.38rem;
      transform: translateX(-50%);
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px white;
      z-index: 2;
    }

    .cv-main {
      font-size: 0.92rem;
      color: var(--muted);
      padding-left: var(--main-gap);
      padding-top: 0.1rem;
      padding-bottom: 0.75rem;
      min-width: 0;
      overflow-wrap: break-word;
    }

    .cv-row:last-child .cv-main,
    .cv-block .cv-row:last-child .cv-main {
      padding-bottom: 0;
    }

    .cv-main p {
      margin-bottom: 0.5rem;
    }

    .cv-main p:last-child {
      margin-bottom: 0;
    }

    .cv-main--spacer {
      padding-bottom: 0.35rem;
      min-height: 0;
    }

    /* Languages with C2 bars */
    .lang-row {
      display: grid;
      grid-template-columns: 7rem 1fr auto;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.55rem;
      font-size: 0.88rem;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .lang-row:last-child {
      margin-bottom: 0;
    }

    .lang-name {
      color: var(--text);
      font-weight: 500;
    }

    .lang-bars {
      display: flex;
      gap: 2px;
      height: 13px;
      align-items: stretch;
      max-width: 220px;
    }

    .lang-block {
      flex: 1;
      min-width: 0;
      max-width: 22px;
      background: #e5e7eb;
      border-radius: 1px;
    }

    .lang-block.filled {
      background: var(--accent);
    }

    .lang-level {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Links list */
    .link-list {
      list-style: none;
    }

    .link-list li {
      margin-bottom: 0.35rem;
    }

    .link-list a {
      color: var(--accent-dark);
      text-decoration: none;
      word-break: break-all;
    }

    .link-list a:hover {
      text-decoration: underline;
    }

    .tl-verify {
      margin-top: 0.35rem;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .tl-verify a {
      color: var(--accent);
      text-decoration: none;
    }

    .tl-verify a:hover {
      text-decoration: underline;
    }

    /* Skills — two columns like PDF */
    .skills-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem 2rem;
      font-size: 0.86rem;
      color: var(--text);
    }

    .skills-cols ul {
      list-style: disc;
      padding-left: 1.15rem;
    }

    .skills-cols li {
      margin-bottom: 0.22rem;
      padding-left: 0.1rem;
    }

    /* Experience / education — dates in aside column (left of line) */
    .tl-role {
      font-weight: 600;
      color: var(--text);
      font-size: 0.92rem;
      margin-bottom: 0.15rem;
    }

    .tl-org {
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .tl-desc {
      font-size: 0.88rem;
      line-height: 1.55;
    }

    @page {
      size: A4 portrait;
      margin: 14mm;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .cv-toolbar {
        display: none;
      }

      .page {
        box-shadow: none;
        border: none;
        border-radius: 0;
        padding: 1.5rem 1.75rem 1rem;
        max-width: none;
      }

      .cv-photo {
        width: 108px;
        height: 108px;
      }

      .cv-top {
        grid-template-columns: 108px 1fr auto;
        margin-bottom: 1.1rem;
      }

      .cv-block {
        margin-bottom: 0.65rem;
        break-inside: auto;
        page-break-inside: auto;
      }

      .cv-block--section-head {
        margin-bottom: 0.3rem;
      }

      .cv-row,
      .cv-top,
      .lang-row {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .cv-main {
        padding-bottom: 0.4rem;
      }

      .tl-desc {
        orphans: 3;
        widows: 3;
      }

      a {
        color: var(--accent-dark) !important;
        text-decoration: none;
      }

      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }

    @media (max-width: 640px) {
      :root {
        --aside-w: 108px;
        --main-gap: 0.75rem;
      }

      .page {
        padding: 1.25rem 1rem;
      }

      .cv-top {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .cv-photo {
        margin: 0 auto;
      }

      .cv-credentials {
        --cv-cred-size: 80px;
        justify-self: center;
        margin-top: 0.35rem;
        gap: 0.45rem;
      }

      .cv-europass-badge,
      .cv-qr-badge {
        width: var(--cv-cred-size);
        height: var(--cv-cred-size);
        flex: 0 0 var(--cv-cred-size);
        box-sizing: border-box;
      }

      .cv-europass-badge {
        min-height: unset;
        max-width: unset;
        padding: 0.4rem 0.35rem;
        font-size: 0.58rem;
      }

      .cv-qr-badge {
        padding: 0.35rem;
        justify-self: auto;
      }

      .cv-qr-badge img {
        width: calc(var(--cv-cred-size) - 0.7rem);
        height: calc(var(--cv-cred-size) - 0.7rem);
      }

      .cv-name {
        font-size: 1.65rem;
      }

      .cv-contact-list {
        align-items: center;
      }

      .cv-flow::before {
        display: none;
      }

      .cv-row {
        grid-template-columns: var(--rail-w) 1fr;
      }

      .cv-aside {
        grid-column: 2;
        text-align: left;
        padding-right: 0;
        padding-left: 0;
      }

      .cv-rail {
        grid-row: 1;
        grid-column: 1;
      }

      .cv-main {
        grid-column: 2;
        padding-left: 0.65rem;
      }

      .cv-dot {
        left: 0;
        transform: none;
      }

      .skills-cols {
        grid-template-columns: 1fr;
      }

      .lang-row {
        grid-template-columns: 1fr;
        gap: 0.35rem;
      }

      .cv-toolbar__inner {
        flex-direction: column;
        align-items: stretch;
        padding: 0.75rem;
      }

      .cv-toolbar__back {
        justify-content: center;
      }

      .cv-toolbar__langs {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .cv-toolbar__actions {
        flex-direction: column;
        width: 100%;
      }

      .cv-toolbar__print {
        justify-content: center;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header class="cv-toolbar" id="toolbar">
    <div class="cv-toolbar__inner">
      <a class="cv-toolbar__back" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Portfolio
      </a>
      <div class="cv-toolbar__langs" id="toolbar-langs" role="group" aria-label="Language"></div>
      <div class="cv-toolbar__actions">
        <button type="button" class="cv-toolbar__print cv-toolbar__print--ghost" id="toolbar-print">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
            <rect x="6" y="14" width="12" height="8" />
          </svg>
          <span data-i18n-print>Print</span>
        </button>
        <div class="cv-toolbar__save-wrap">
          <button
            type="button"
            class="cv-toolbar__print"
            id="toolbar-save"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="toolbar-save-menu"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 3v12M8 11l4 4 4-4" />
              <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
            </svg>
            <span data-i18n-save>Save</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="width:0.85rem;height:0.85rem">
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>
          <ul class="cv-toolbar__save-menu" id="toolbar-save-menu" role="menu">
            <li role="none">
              <button type="button" role="menuitem" data-save-format="pdf">
                PDF <span class="fmt-ext">.pdf</span>
              </button>
            </li>
            <li role="none">
              <button type="button" role="menuitem" data-save-format="word">
                Word <span class="fmt-ext">.docx</span>
              </button>
            </li>
            <li role="none">
              <button type="button" role="menuitem" data-save-format="html">
                HTML <span class="fmt-ext">.html</span>
              </button>
            </li>
            <li role="none">
              <button type="button" role="menuitem" data-save-format="png">
                Image <span class="fmt-ext">.png</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </header>
  <article class="page" id="cv-root"></article>

  <script src="/vendor/jspdf.umd.min.js"></script>
  <script src="/vendor/jszip.min.js"></script>
  <script src="/cv-data.js"></script>

    function ui(lang) {
      return UI[lang] || UI.en;
    }

    function section(label, content) {
      return `
          <div class="cv-block">
            <div class="cv-row">
              <div class="cv-aside"><h2>${label}</h2></div>
              <div class="cv-rail" aria-hidden="true"><span class="cv-dot"></span></div>
              <div class="cv-main">${content}</div>
            </div>
          </div>`;
    }

    function timelineSection(label, items, labels, lang) {
      const head = `
          <div class="cv-block cv-block--section-head">
            <div class="cv-row">
              <div class="cv-aside"><h2>${label}</h2></div>
              <div class="cv-rail" aria-hidden="true"><span class="cv-dot"></span></div>
              <div class="cv-main cv-main--spacer"></div>
            </div>
          </div>`;
      const entries = items
        .map(
          (item) => `
          <div class="cv-block cv-block--entry">
            <div class="cv-row">
              <div class="cv-aside cv-date">${item.period}</div>
              <div class="cv-rail" aria-hidden="true"><span class="cv-dot"></span></div>
              <div class="cv-main">
                <p class="tl-role">${item.title}</p>
                ${item.sub ? `<p class="tl-org">${item.sub}</p>` : ''}
                ${item.desc ? `<p class="tl-desc">${item.desc}</p>` : ''}
                ${item.verifyUrl
              ? `<p class="tl-verify"><a href="${item.verifyUrl}" target="_blank" rel="noopener noreferrer">${labels.verifyDiploma}</a></p>
                <p class="tl-verify"><a href="${europassPdfForLang(lang)}" target="_blank" rel="noopener noreferrer">${labels.europassTimeline}</a></p>`
              : ''
            }
              </div>
            </div>
          </div>`,
        )
        .join('');
      return `${head}${entries}`;
    }

    function languageRow(label, proficientLabel) {
      const match = label.match(/^(.+?)\s*\((C\d)\)$/i);
      const name = match ? match[1].trim() : label;
      const level = match ? match[2].toUpperCase() : '';
      const filled = level === 'C2' ? 8 : level === 'C1' ? 6 : level === 'B2' ? 4 : 3;
      const blocks = Array.from({ length: 8 }, (_, i) =>
        `<span class="lang-block${i < filled ? ' filled' : ''}"></span>`,
      ).join('');
      const levelText = level ? `${level} ${proficientLabel}` : label;
      return `
          <div class="lang-row">
            <span class="lang-name">${name}</span>
            <div class="lang-bars" aria-hidden="true">${blocks}</div>
            <span class="lang-level">${levelText}</span>
          </div>`;
    }

    function splitSkills(skills) {
      const mid = Math.ceil(skills.length / 2);
      return [skills.slice(0, mid), skills.slice(mid)];
    }

    async function waitForImages(root) {
      const images = [...root.querySelectorAll('img')];
      await Promise.all(
        images.map(
          (img) =>
            new Promise((resolve) => {
              if (img.complete) resolve();
              else {
                img.onload = () => resolve();
                img.onerror = () => resolve();
              }
            }),
        ),
      );
    }

    function renderPhotoDataUrl(img) {
      if (!img || !img.complete || !img.naturalWidth) return null;
      const canvas = document.createElement('canvas');
      const size = 432;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      const nw = img.naturalWidth;
      const nh = img.naturalHeight;
      const side = Math.min(nw, nh);
      let sx = (nw - side) / 2;
      let sy = Math.max(0, (nh - side) * 0.85);
      if (sy + side > nh) sy = nh - side;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      return canvas.toDataURL('image/jpeg', 0.98);
    }

    async function buildExportNode() {
      const page = document.querySelector('.page');
      await waitForImages(page);

      const photoData = renderPhotoDataUrl(document.querySelector('.cv-photo'));
      const wrapper = document.createElement('div');
      wrapper.className = 'pdf-export-root';
      wrapper.style.cssText =
        'position:absolute;left:-9999px;top:0;background:#fff;overflow:visible;';

      const clone = page.cloneNode(true);
      clone.classList.add('page--export');

      const photo = clone.querySelector('.cv-photo');
      if (photo && photoData) {
        photo.src = photoData;
        photo.style.width = '108px';
        photo.style.height = '108px';
        photo.style.objectFit = 'cover';
        photo.style.objectPosition = 'center 90%';
        photo.style.borderRadius = '4px';
      }

      wrapper.appendChild(clone);
      document.body.appendChild(wrapper);
      wrapper.style.width = `${clone.offsetWidth}px`;

      await waitForImages(clone);
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      return { wrapper, clone };
    }

    function getJsPDF() {
      if (window.jspdf?.jsPDF) return window.jspdf.jsPDF;
      if (typeof window.jsPDF === 'function') return window.jsPDF;
      throw new Error('jsPDF not loaded');
    }

    function collectBlockRanges(clone) {
      const cloneRect = clone.getBoundingClientRect();
      return [...clone.querySelectorAll('.cv-top, .cv-block')].map((el) => {
        const r = el.getBoundingClientRect();
        return {
          top: r.top - cloneRect.top,
          bottom: r.bottom - cloneRect.top,
          height: r.height,
        };
      });
    }

    function collectLinks(clone) {
      const cloneRect = clone.getBoundingClientRect();
      return [...clone.querySelectorAll('a[href]')].map((el) => {
        const r = el.getBoundingClientRect();
        return {
          href: el.href,
          top: r.top - cloneRect.top,
          left: r.left - cloneRect.left,
          width: r.width,
          height: r.height,
          bottom: r.bottom - cloneRect.top,
        };
      });
    }

    function buildPageSlices(totalCssH, maxCssPageH, blocks) {
      const slices = [];
      let pageStart = 0;

      while (pageStart < totalCssH - 0.5) {
        let pageEnd = Math.min(pageStart + maxCssPageH, totalCssH);

        for (const block of blocks) {
          const cutsThroughBlock =
            pageEnd > block.top + 4 && pageEnd < block.bottom - 4 && block.height <= maxCssPageH;
          if (cutsThroughBlock) {
            pageEnd = block.top;
            break;
          }
        }

        if (pageEnd <= pageStart + 4) {
          pageEnd = Math.min(pageStart + maxCssPageH, totalCssH);
        }

        slices.push({ startCss: pageStart, endCss: pageEnd });
        pageStart = pageEnd;
      }

      return slices;
    }

    function addLinksForSlice(pdf, links, slice, margin, contentW, cssWidth, sliceH_mm) {
      const cssSliceH = slice.endCss - slice.startCss;
      if (cssSliceH <= 0) return;

      const mmPerCssX = contentW / cssWidth;
      const mmPerCssY = sliceH_mm / cssSliceH;

      links.forEach((link) => {
        if (link.bottom <= slice.startCss || link.top >= slice.endCss) return;

        const x = margin + link.left * mmPerCssX;
        const y = margin + (link.top - slice.startCss) * mmPerCssY;
        const w = Math.max(link.width * mmPerCssX, 1);
        const h = Math.max(link.height * mmPerCssY, 1);

        pdf.link(x, y, w, h, { url: link.href });
      });
    }

    function collectTextRuns(clone) {
      const cloneRect = clone.getBoundingClientRect();
      const runs = [];
      const elements = clone.querySelectorAll(
        'h1, h2, h3, p, li, span.lang-name, span.lang-level, a, .cv-aside.cv-date, .tl-role, .tl-org, .tl-desc, .cv-contact-list span, .cv-contact-list a',
      );

      elements.forEach((el) => {
        const style = window.getComputedStyle(el);
        if (style.display === 'none' || style.visibility === 'hidden') return;

        const text = el.textContent.replace(/\s+/g, ' ').trim();
        if (!text) return;

        const bold = parseInt(style.fontWeight, 10) >= 600 || style.fontWeight === 'bold';
        const fontSize = parseFloat(style.fontSize) || 12;
        const range = document.createRange();
        range.selectNodeContents(el);
        const rects = [...range.getClientRects()].filter((r) => r.width > 0 && r.height > 0);

        if (rects.length <= 1) {
          const rect = rects[0] || el.getBoundingClientRect();
          runs.push({
            text,
            top: rect.top - cloneRect.top,
            left: rect.left - cloneRect.left,
            width: rect.width,
            height: rect.height,
            bottom: rect.bottom - cloneRect.top,
            fontSize,
            bold,
          });
          return;
        }

        const totalWidth = rects.reduce((sum, r) => sum + r.width, 0);
        const words = text.split(' ');
        let wordIdx = 0;

        rects.forEach((rect) => {
          const targetChars = Math.max(
            1,
            Math.round(text.length * (rect.width / Math.max(totalWidth, 1))),
          );
          let lineText = '';
          while (wordIdx < words.length && (lineText.length < targetChars || !lineText)) {
            lineText += (lineText ? ' ' : '') + words[wordIdx++];
          }
          lineText = lineText.trim();
          if (!lineText) return;

          runs.push({
            text: lineText,
            top: rect.top - cloneRect.top,
            left: rect.left - cloneRect.left,
            width: rect.width,
            height: rect.height,
            bottom: rect.bottom - cloneRect.top,
            fontSize,
            bold,
          });
        });
      });

      return runs;
    }

    function addSelectableTextForSlice(pdf, runs, slice, margin, contentW, cssWidth, sliceH_mm) {
      const cssSliceH = slice.endCss - slice.startCss;
      if (cssSliceH <= 0 || !runs.length) return;

      const mmPerCssX = contentW / cssWidth;
      const mmPerCssY = sliceH_mm / cssSliceH;

      pdf.saveGraphicsState();
      pdf.internal.write('3 Tr\n');

      runs.forEach((run) => {
        if (run.bottom <= slice.startCss || run.top >= slice.endCss) return;

        const x = margin + run.left * mmPerCssX;
        const y = margin + (run.top - slice.startCss + run.height * 0.8) * mmPerCssY;
        const fontPt = Math.max(4, (run.fontSize * mmPerCssX) / 0.352778);

        pdf.setFont('helvetica', run.bold ? 'bold' : 'normal');
        pdf.setFontSize(fontPt);
        pdf.text(run.text, x, y, { maxWidth: Math.max(run.width * mmPerCssX, 1) });
      });

      pdf.internal.write('0 Tr\n');
      pdf.restoreGraphicsState();
    }

    async function renderExportPages() {
      if (typeof html2canvas !== 'function') {
        throw new Error('html2canvas not loaded');
      }

      window.scrollTo(0, 0);
      const { wrapper, clone } = await buildExportNode();

      try {
        const exportW = clone.offsetWidth;
        const exportH = clone.scrollHeight;
        const blocks = collectBlockRanges(clone);
        const links = collectLinks(clone);
        const textRuns = collectTextRuns(clone);
        const scale = 2;

        const canvas = await html2canvas(clone, {
          scale,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#ffffff',
          logging: false,
          scrollX: 0,
          scrollY: 0,
          windowWidth: exportW,
          windowHeight: exportH,
        });

        const pageW = 210;
        const pageH = 297;
        const margin = 8;
        const contentW = pageW - margin * 2;
        const contentH_mm = pageH - margin * 2;
        const cssTotalH = canvas.height / scale;
        const cssTotalW = canvas.width / scale;
        const imgH_mm = (canvas.height * contentW) / canvas.width;
        const maxCssPageH = cssTotalH * (contentH_mm / imgH_mm);
        const slices = buildPageSlices(cssTotalH, maxCssPageH, blocks);
        const pxPerMm = canvas.width / contentW;

        const pages = slices.map((slice) => {
          const startPx = Math.round(slice.startCss * scale);
          const sliceHPx = Math.max(1, Math.round((slice.endCss - slice.startCss) * scale));
          const sliceCanvas = document.createElement('canvas');
          sliceCanvas.width = canvas.width;
          sliceCanvas.height = sliceHPx;
          const ctx = sliceCanvas.getContext('2d');
          ctx.drawImage(canvas, 0, startPx, canvas.width, sliceHPx, 0, 0, canvas.width, sliceHPx);

          const sliceH_mm = (sliceHPx * contentW) / canvas.width;
          const pageCanvas = document.createElement('canvas');
          pageCanvas.width = Math.round(pageW * pxPerMm);
          pageCanvas.height = Math.round(pageH * pxPerMm);
          const pageCtx = pageCanvas.getContext('2d');
          pageCtx.fillStyle = '#ffffff';
          pageCtx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
          pageCtx.drawImage(
            sliceCanvas,
            Math.round(margin * pxPerMm),
            Math.round(margin * pxPerMm),
            Math.round(contentW * pxPerMm),
            Math.round(sliceH_mm * pxPerMm),
          );

          const cssSliceH = slice.endCss - slice.startCss;
          const mmPerCssX = contentW / cssTotalW;
          const mmPerCssY = sliceH_mm / Math.max(cssSliceH, 0.001);
          const pageLinks = [];
          links.forEach((link) => {
            if (link.bottom <= slice.startCss || link.top >= slice.endCss) return;
            pageLinks.push({
              href: link.href,
              xMm: margin + link.left * mmPerCssX,
              yMm: margin + (link.top - slice.startCss) * mmPerCssY,
              wMm: Math.max(link.width * mmPerCssX, 1),
              hMm: Math.max(link.height * mmPerCssY, 1),
            });
          });

          return { slice, sliceCanvas, pageCanvas, sliceH_mm, links: pageLinks };
        });

        return { wrapper, pages, textRuns, cssTotalW, contentW, margin, pageW, pageH };
      } catch (err) {
        wrapper.remove();
        throw err;
      }
    }

    async function generatePdfDocument() {
      const model = await renderExportPages();
      try {
        const jsPDF = getJsPDF();
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

        model.pages.forEach((page, index) => {
          if (index > 0) pdf.addPage();
          pdf.addImage(
            page.sliceCanvas.toDataURL('image/jpeg', 0.98),
            'JPEG',
            model.margin,
            model.margin,
            model.contentW,
            page.sliceH_mm,
          );
          page.links.forEach((link) => {
            pdf.link(link.xMm, link.yMm, link.wMm, link.hMm, { url: link.href });
          });
          addSelectableTextForSlice(
            pdf,
            model.textRuns,
            page.slice,
            model.margin,
            model.contentW,
            model.cssTotalW,
            page.sliceH_mm,
          );
        });

        return pdf;
      } finally {
        model.wrapper.remove();
      }
    }

    function currentUi() {
      const lang = localStorage.getItem('cv-lang') || 'en';
      return UI[lang] || UI.en;
    }

    function setExportBusy(busy, label) {
      const printBtn = document.getElementById('toolbar-print');
      const saveBtn = document.getElementById('toolbar-save');
      const menuBtns = document.querySelectorAll('#toolbar-save-menu button');
      printBtn.disabled = busy;
      saveBtn.disabled = busy;
      menuBtns.forEach((b) => {
        b.disabled = busy;
      });
      if (label) {
        const labelEl = saveBtn.querySelector('[data-i18n-save]');
        if (labelEl) labelEl.textContent = label;
      }
    }

    function restoreSaveLabel() {
      const saveBtn = document.getElementById('toolbar-save');
      const labelEl = saveBtn.querySelector('[data-i18n-save]');
      if (labelEl) labelEl.textContent = currentUi().save;
    }

    function closeSaveMenu() {
      const menu = document.getElementById('toolbar-save-menu');
      const saveBtn = document.getElementById('toolbar-save');
      menu.classList.remove('is-open');
      saveBtn.setAttribute('aria-expanded', 'false');
    }

    function toggleSaveMenu() {
      const menu = document.getElementById('toolbar-save-menu');
      const saveBtn = document.getElementById('toolbar-save');
      const open = !menu.classList.contains('is-open');
      menu.classList.toggle('is-open', open);
      saveBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    function cvFileBase() {
      return `Editor-Jakupi-CV-${localStorage.getItem('cv-lang') || 'en'}`;
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function fetchAsDataUrl(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Could not fetch ${url}`);
      return blobToDataUrl(await res.blob());
    }

    function canvasImageToDataUrl(img, type = 'image/png') {
      if (!img || !img.complete || !img.naturalWidth) return null;
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        return canvas.toDataURL(type);
      } catch {
        return null;
      }
    }

    async function inlineExportImages(root) {
      const liveRoot = document.getElementById('cv-root');
      await waitForImages(liveRoot);

      const livePhoto = liveRoot.querySelector('.cv-photo');
      const photo = root.querySelector('.cv-photo');
      if (photo) {
        const data =
          renderPhotoDataUrl(livePhoto) ||
          canvasImageToDataUrl(livePhoto, 'image/jpeg') ||
          (await fetchAsDataUrl(livePhoto?.currentSrc || livePhoto?.src || '/me.jpg').catch(() => null));
        if (data) photo.setAttribute('src', data);
      }

      const liveImgs = [...liveRoot.querySelectorAll('img:not(.cv-photo)')];
      const cloneImgs = [...root.querySelectorAll('img:not(.cv-photo)')];
      await Promise.all(
        cloneImgs.map(async (img, i) => {
          const live = liveImgs[i];
          const data =
            canvasImageToDataUrl(live) ||
            (await fetchAsDataUrl(live?.currentSrc || live?.src || img.getAttribute('src') || '').catch(
              () => null,
            ));
          if (data) img.setAttribute('src', data);
        }),
      );
    }

    async function buildExportHtmlDocument() {
      const styleEl = document.querySelector('style');
      const styleText = styleEl ? styleEl.textContent : '';
      const root = document.getElementById('cv-root').cloneNode(true);
      root.classList.add('page--export');
      root.querySelectorAll('a[href]').forEach((a) => {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      });
      await inlineExportImages(root);

      return `<!DOCTYPE html>
<html lang="${localStorage.getItem('cv-lang') || 'en'}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>${cvFileBase()}</title>
  <style>
${styleText}
body { background: #fff; margin: 0; padding: 1rem; }
.cv-toolbar { display: none !important; }
.page { box-shadow: none; border: none; margin: 0 auto; }
  </style>
</head>
<body>
${root.outerHTML}
</body>
</html>`;
    }

    function escapeXml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function mmToEmu(mm) {
      return Math.round(mm * 36000);
    }

    function canvasToJpegBytes(canvas, quality = 0.92) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(
          (blob) => {
            if (!blob) {
              reject(new Error('Could not encode page image'));
              return;
            }
            blob.arrayBuffer().then((buf) => resolve(new Uint8Array(buf)), reject);
          },
          'image/jpeg',
          quality,
        );
      });
    }

    function wordPagePictureXml(imgRid, docPrId) {
      const cx = mmToEmu(210);
      const cy = mmToEmu(297);
      return `<w:p>
  <w:r>
    <w:drawing>
      <wp:anchor distT="0" distB="0" distL="0" distR="0" simplePos="0" relativeHeight="0" behindDoc="1" locked="0" layoutInCell="1" allowOverlap="1">
        <wp:simplePos x="0" y="0"/>
        <wp:positionH relativeFrom="page"><wp:posOffset>0</wp:posOffset></wp:positionH>
        <wp:positionV relativeFrom="page"><wp:posOffset>0</wp:posOffset></wp:positionV>
        <wp:extent cx="${cx}" cy="${cy}"/>
        <wp:effectExtent l="0" t="0" r="0" b="0"/>
        <wp:wrapNone/>
        <wp:docPr id="${docPrId}" name="CV page ${docPrId}"/>
        <wp:cNvGraphicFramePr/>
        <a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">
          <a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">
            <pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
              <pic:nvPicPr>
                <pic:cNvPr id="${docPrId}" name=""/>
                <pic:cNvPicPr/>
              </pic:nvPicPr>
              <pic:blipFill>
                <a:blip r:embed="${imgRid}"/>
                <a:stretch><a:fillRect/></a:stretch>
              </pic:blipFill>
              <pic:spPr>
                <a:xfrm>
                  <a:off x="0" y="0"/>
                  <a:ext cx="${cx}" cy="${cy}"/>
                </a:xfrm>
                <a:prstGeom prst="rect"><a:avLst/></a:prstGeom>
              </pic:spPr>
            </pic:pic>
          </a:graphicData>
        </a:graphic>
      </wp:anchor>
    </w:drawing>
  </w:r>
</w:p>`;
    }

    function wordHotspotXml(linkRid, xMm, yMm, wMm, hMm, docPrId) {
      const x = mmToEmu(xMm);
      const y = mmToEmu(yMm);
      const cx = mmToEmu(Math.max(wMm, 2));
      const cy = mmToEmu(Math.max(hMm, 2));
      return `<w:p>
  <w:r>
    <w:drawing>
      <wp:anchor distT="0" distB="0" distL="0" distR="0" simplePos="0" relativeHeight="${docPrId}" behindDoc="0" locked="0" layoutInCell="1" allowOverlap="1">
        <wp:simplePos x="0" y="0"/>
        <wp:positionH relativeFrom="page"><wp:posOffset>${x}</wp:posOffset></wp:positionH>
        <wp:positionV relativeFrom="page"><wp:posOffset>${y}</wp:posOffset></wp:positionV>
        <wp:extent cx="${cx}" cy="${cy}"/>
        <wp:effectExtent l="0" t="0" r="0" b="0"/>
        <wp:wrapNone/>
        <wp:docPr id="${docPrId}" name="Link ${docPrId}">
          <a:hlinkClick xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" r:id="${linkRid}"/>
        </wp:docPr>
        <wp:cNvGraphicFramePr/>
        <a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">
          <a:graphicData uri="http://schemas.microsoft.com/office/word/2010/wordprocessingShape">
            <wps:wsp xmlns:wps="http://schemas.microsoft.com/office/word/2010/wordprocessingShape">
              <wps:cNvSpPr/>
              <wps:spPr>
                <a:xfrm>
                  <a:off x="0" y="0"/>
                  <a:ext cx="${cx}" cy="${cy}"/>
                </a:xfrm>
                <a:prstGeom prst="rect"><a:avLst/></a:prstGeom>
                <a:solidFill>
                  <a:srgbClr val="FFFFFF"><a:alpha val="1000"/></a:srgbClr>
                </a:solidFill>
                <a:ln><a:noFill/></a:ln>
              </wps:spPr>
              <wps:bodyPr/>
            </wps:wsp>
          </a:graphicData>
        </a:graphic>
      </wp:anchor>
    </w:drawing>
  </w:r>
</w:p>`;
    }

    async function buildExactDocxBlob(pages) {
      if (typeof JSZip === 'undefined') throw new Error('JSZip not loaded');

      const zip = new JSZip();
      const word = zip.folder('word');
      const media = word.folder('media');
      const rels = [];
      const bodyParts = [];
      const hrefToRid = new Map();
      let nextRid = 1;
      let docPrId = 1;

      const allocRid = () => {
        const id = `rId${nextRid}`;
        nextRid += 1;
        return id;
      };

      const linkRidFor = (href) => {
        if (hrefToRid.has(href)) return hrefToRid.get(href);
        const rid = allocRid();
        hrefToRid.set(href, rid);
        rels.push(
          `<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="${escapeXml(href)}" TargetMode="External"/>`,
        );
        return rid;
      };

      for (let i = 0; i < pages.length; i += 1) {
        const page = pages[i];
        const imgRid = allocRid();
        const fileName = `image${i + 1}.jpeg`;
        media.file(fileName, await canvasToJpegBytes(page.pageCanvas));
        rels.push(
          `<Relationship Id="${imgRid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${fileName}"/>`,
        );

        if (i > 0) {
          bodyParts.push('<w:p><w:r><w:br w:type="page"/></w:r></w:p>');
        }
        bodyParts.push(wordPagePictureXml(imgRid, docPrId));
        docPrId += 1;

        page.links.forEach((link) => {
          if (!link.href) return;
          bodyParts.push(
            wordHotspotXml(linkRidFor(link.href), link.xMm, link.yMm, link.wMm, link.hMm, docPrId),
          );
          docPrId += 1;
        });
      }

      bodyParts.push(`<w:sectPr>
  <w:pgSz w:w="11906" w:h="16838"/>
  <w:pgMar w:top="0" w:right="0" w:bottom="0" w:left="0" w:header="0" w:footer="0" w:gutter="0"/>
</w:sectPr>`);

      zip.file(
        '[Content_Types].xml',
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Default Extension="jpeg" ContentType="image/jpeg"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`,
      );
      zip.folder('_rels').file(
        '.rels',
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`,
      );
      word.file(
        'document.xml',
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document
  xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
  xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
  xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
  xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
  xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"
  xmlns:wps="http://schemas.microsoft.com/office/word/2010/wordprocessingShape">
  <w:body>
${bodyParts.join('\n')}
  </w:body>
</w:document>`,
      );
      word.folder('_rels').file(
        'document.xml.rels',
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${rels.join('\n')}
</Relationships>`,
      );

      return zip.generateAsync({
        type: 'blob',
        mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      });
    }

    async function savePdf() {
      const labels = currentUi();
      setExportBusy(true, labels.generatingPdf);
      try {
        const pdf = await generatePdfDocument();
        pdf.save(`${cvFileBase()}.pdf`);
      } catch {
        alert(labels.errPdf);
      } finally {
        setExportBusy(false);
        restoreSaveLabel();
      }
    }

    async function saveWord() {
      const labels = currentUi();
      setExportBusy(true, labels.generatingWord);
      try {
        const model = await renderExportPages();
        try {
          const blob = await buildExactDocxBlob(model.pages);
          downloadBlob(blob, `${cvFileBase()}.docx`);
        } finally {
          model.wrapper.remove();
        }
      } catch {
        alert(labels.errWord);
      } finally {
        setExportBusy(false);
        restoreSaveLabel();
      }
    }

    async function saveHtml() {
      const labels = currentUi();
      setExportBusy(true, labels.generatingHtml);
      try {
        const html = await buildExportHtmlDocument();
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        downloadBlob(blob, `${cvFileBase()}.html`);
      } catch {
        alert(labels.errHtml);
      } finally {
        setExportBusy(false);
        restoreSaveLabel();
      }
    }

    async function savePng() {
      const labels = currentUi();
      setExportBusy(true, labels.generatingPng);
      let exportRoot = null;
      try {
        const page = document.getElementById('cv-root');
        const clone = page.cloneNode(true);
        clone.classList.add('page', 'page--export');
        exportRoot = document.createElement('div');
        exportRoot.className = 'pdf-export-root';
        exportRoot.style.cssText =
          'position:fixed;left:-10000px;top:0;width:900px;background:#fff;z-index:-1;';
        exportRoot.appendChild(clone);
        document.body.appendChild(exportRoot);
        const canvas = await window.html2canvas(clone, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff',
          logging: false,
        });
        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/png');
        });
        downloadBlob(blob, `${cvFileBase()}.png`);
      } catch {
        alert(labels.errPng);
      } finally {
        if (exportRoot) exportRoot.remove();
        setExportBusy(false);
        restoreSaveLabel();
      }
    }

    async function printCv() {
      const printBtn = document.getElementById('toolbar-print');
      const originalPrintHtml = printBtn.innerHTML;
      const labels = currentUi();

      setExportBusy(true);
      const printLabel = printBtn.querySelector('[data-i18n-print]');
      if (printLabel) printLabel.textContent = labels.preparingPrint;
      else printBtn.textContent = labels.preparingPrint;

      try {
        const pdf = await generatePdfDocument();
        const blob = pdf.output('blob');
        const url = URL.createObjectURL(blob);
        const printWindow = window.open(url, '_blank');

        if (!printWindow) {
          URL.revokeObjectURL(url);
          alert(labels.errPrintPopup);
          return;
        }

        const triggerPrint = () => {
          try {
            printWindow.focus();
            printWindow.print();
          } catch {
            /* PDF viewer may require manual print */
          }
        };

        printWindow.addEventListener('load', triggerPrint);
        setTimeout(triggerPrint, 900);
        setTimeout(() => URL.revokeObjectURL(url), 120000);
      } catch {
        alert(labels.errPrint);
      } finally {
        setExportBusy(false);
        printBtn.innerHTML = originalPrintHtml;
        restoreSaveLabel();
      }
    }

    function applyToolbarLabels(lang) {
      const labels = UI[lang] || UI.en;
      const printLabel = document.querySelector('[data-i18n-print]');
      const saveLabel = document.querySelector('[data-i18n-save]');
      if (printLabel) printLabel.textContent = labels.print;
      if (saveLabel) saveLabel.textContent = labels.save;
    }

    async function handleSaveFormat(format) {
      closeSaveMenu();
      if (format === 'pdf') await savePdf();
      else if (format === 'word') await saveWord();
      else if (format === 'html') await saveHtml();
      else if (format === 'png') await savePng();
    }

    let toolbarReady = false;

    function init() {
      if (toolbarReady) return;
      toolbarReady = true;

      const langGroup = document.getElementById('toolbar-langs');
      const printBtn = document.getElementById('toolbar-print');
      const saveBtn = document.getElementById('toolbar-save');
      const saveMenu = document.getElementById('toolbar-save-menu');
      const stored = localStorage.getItem('cv-lang');
      let active = stored && window.CV_DATA.entries[stored] ? stored : 'en';

      // One button per language — clear first so a re-run never stacks duplicates
      langGroup.replaceChildren();
      const seen = new Set();
      window.CV_DATA.langs.forEach(({ code, label }) => {
        if (seen.has(code)) return;
        seen.add(code);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = label;
        btn.dataset.lang = code;
        btn.setAttribute('aria-pressed', code === active ? 'true' : 'false');
        btn.addEventListener('click', () => {
          active = code;
          localStorage.setItem('cv-lang', code);
          langGroup.querySelectorAll('button[data-lang]').forEach((b) => {
            b.classList.remove('active');
            b.setAttribute('aria-pressed', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-pressed', 'true');
          applyToolbarLabels(code);
          renderCv(code);
        });
        if (code === active) btn.classList.add('active');
        langGroup.appendChild(btn);
      });

      printBtn.onclick = () => printCv();
      saveBtn.onclick = (event) => {
        event.preventDefault();
        event.stopPropagation();
        toggleSaveMenu();
      };
      saveMenu.querySelectorAll('[data-save-format]').forEach((btn) => {
        btn.onclick = (event) => {
          event.preventDefault();
          event.stopPropagation();
          handleSaveFormat(btn.getAttribute('data-save-format'));
        };
      });
      document.addEventListener('click', (event) => {
        if (!event.target.closest('.cv-toolbar__save-wrap')) closeSaveMenu();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeSaveMenu();
      });

      applyToolbarLabels(active);
      renderCv(active);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init, { once: true });
    } else {
      init();
    }
  </script>
</body>

</html>
