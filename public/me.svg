<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Editor Jakupi">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- outer ring -->
  <circle cx="160" cy="160" r="156" fill="none" stroke="url(#ring)" stroke-width="4"/>

  <!-- background disc -->
  <circle cx="160" cy="160" r="148" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="148" fill="url(#glow)"/>

  <!-- subtle grid accent -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="40" y1="160" x2="280" y2="160"/>
    <line x1="160" y1="40" x2="160" y2="280"/>
    <circle cx="160" cy="160" r="72" fill="none"/>
    <circle cx="160" cy="160" r="108" fill="none"/>
  </g>

  <!-- soft glow blob -->
  <ellipse cx="118" cy="118" rx="56" ry="48" fill="#818cf8" opacity="0.12" filter="url(#soft)"/>

  <!-- initials -->
  <text
    x="160"
    y="178"
    text-anchor="middle"
    font-family="Georgia, 'Instrument Serif', serif"
    font-size="92"
    font-style="italic"
    fill="url(#text)"
    letter-spacing="-2"
  >EJ</text>

  <!-- bottom accent bar -->
  <rect x="96" y="228" width="128" height="4" rx="2" fill="url(#ring)" opacity="0.85"/>
</svg>
